<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier — Manuscrits et concordances</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#222;background:#f5f4f0}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #ddd;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:19px;margin:0;font-weight:650}button,input,select{font:inherit;padding:8px 10px;border:1px solid #c9c9c4;border-radius:5px;background:#fff;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}main{padding:16px;max-width:1500px;margin:auto}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.status{color:#666;font-size:13px}.viewer{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,1.2fr);gap:14px;align-items:start}.panel{background:white;border:1px solid #ddd;border-radius:7px;overflow:hidden;min-width:0}.panel h2{font-size:15px;margin:0;padding:11px 13px;border-bottom:1px solid #e5e5e0}.lines{padding:10px;max-height:72vh;overflow:auto}.line{padding:7px 8px;border-radius:4px;cursor:pointer;line-height:1.55;white-space:pre-wrap}.line:hover{background:#f3f1eb}.line.active{background:#fff0bd;outline:1px solid #e2c15d}.image-wrap{padding:12px;overflow:auto;text-align:center;min-height:160px}.image-stage{position:relative;display:inline-block;max-width:100%;line-height:0}.image-stage img{display:block;max-width:100%;height:auto}.image-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.missing{color:#777;padding:24px 10px;font-size:14px}.searchbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 10px}.searchbar input{flex:1;min-width:180px}.results-head{font-size:14px;color:#555;margin:8px 0}.results{display:grid;gap:6px}.hit{padding:10px 12px;border:1px solid #ddd;border-radius:5px;background:white;cursor:pointer;text-align:left;line-height:1.7}.hit:hover{border-color:#999;background:#fcfbf7}mark{background:#ffe08a;color:inherit;border-radius:2px}.empty{color:#777;padding:10px 0;font-size:14px}@media(max-width:760px){.viewer{grid-template-columns:1fr}.lines{max-height:42vh}header{padding:12px}}
</style></head><body>
<header><h1>Atelier — Manuscrits et concordances</h1><button id="open">Ouvrir le dossier du corpus</button><input id="folder" type="file" webkitdirectory directory multiple hidden><span id="status" class="status">Sélectionnez le dossier contenant xml-alto/ et images/.</span></header>
<main><div class="toolbar"><button id="prev" disabled>Précédente</button><select id="page" aria-label="Sélectionner une page" disabled><option value="">Aucune page</option></select><button id="next" disabled>Suivante</button><label for="zoom">Zoom image</label><input id="zoom" type="range" min="50" max="200" step="10" value="100" disabled></div>
<div class="viewer"><section class="panel"><h2>Transcription</h2><div id="text" class="lines"><div class="empty">Aucun manuscrit chargé.</div></div></section><section class="panel"><h2>Image de la page</h2><div id="imageArea" class="image-wrap"><div class="missing">Aucune image chargée.</div></div></section></div>
<section aria-label="Concordances"><div class="searchbar"><input id="query" type="search" placeholder="Rechercher un mot entier…" disabled><button id="search" disabled>Rechercher</button></div><div id="resultHead" class="results-head"></div><div id="results" class="results"></div></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let pages=[],current=0,activeLine=-1,zoom=100,objectUrls=[];const fold=s=>s.normalize('NFC').toLocaleLowerCase();function base(s){return s.split(/[\\/]/).pop().replace(/\.[^.]*$/,'').toLocaleLowerCase()}function descendants(el,name){return Array.from(el.getElementsByTagName('*')).filter(x=>(x.localName||x.nodeName.split(':').pop())===name)}function num(el,key){const n=Number(el?.getAttribute(key));return Number.isFinite(n)?n:0}function clearUrls(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[]}
function xmlPage(file,allFiles){const doc=new DOMParser().parseFromString(file._text,'application/xml');if(doc.querySelector('parsererror'))throw Error('XML invalide');const source=descendants(doc,'fileName')[0]?.textContent.trim();let image=null;if(source){const wanted=source.replace(/\\/g,'/').split('/').pop().toLocaleLowerCase();image=allFiles.find(f=>f.name.toLocaleLowerCase()===wanted)}if(!image)image=allFiles.find(f=>base(f.name)===base(file.name)&&/\.(jpe?g|png)$/i.test(f.name));const lines=descendants(doc,'TextLine').map((el,index)=>({index,text:descendants(el,'String').map(s=>s.getAttribute('CONTENT')||'').join(' '),x:num(el,'HPOS'),y:num(el,'VPOS'),w:num(el,'WIDTH'),h:num(el,'HEIGHT')}));const pageEl=descendants(doc,'Page')[0];return{name:file.name,lines,imageFile:image,pageW:num(pageEl||doc.documentElement,'WIDTH'),pageH:num(pageEl||doc.documentElement,'HEIGHT')}}
function setStatus(s){$('status').textContent=s}function renderPage(){if(!pages.length)return;const p=pages[current];$('page').value=String(current);$('prev').disabled=current===0;$('next').disabled=current===pages.length-1;$('text').replaceChildren();p.lines.forEach((l,i)=>{const d=document.createElement('div');d.className='line'+(i===activeLine?' active':'');d.textContent=l.text;d.dataset.index=i;d.addEventListener('click',()=>selectLine(i,true));$('text').append(d)});const area=$('imageArea');area.replaceChildren();if(!p.imageFile){const d=document.createElement('div');d.className='missing';d.textContent='Aucune image correspondante pour cette page.';area.append(d);return}const stage=document.createElement('div');stage.className='image-stage';const img=document.createElement('img');img.alt='Image de '+p.name;img.src=p.imageUrl;img.style.width=zoom+'%';stage.append(img);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${p.pageW||1} ${p.pageH||1}`);svg.setAttribute('preserveAspectRatio','none');if(activeLine>=0){const l=p.lines[activeLine];if(l){const r=document.createElementNS(svg.namespaceURI,'rect');for(const [k,v] of Object.entries({x:l.x,y:l.y,width:l.w,height:l.h,fill:'#ffd54f','fill-opacity':'.35',stroke:'#e09b00','stroke-width':Math.max(2,(p.pageW||1000)/500)}))r.setAttribute(k,v);svg.append(r)}}stage.append(svg);area.append(stage);img.addEventListener('load',()=>{if(!p.pageW||!p.pageH)svg.setAttribute('viewBox',`0 0 ${img.naturalWidth} ${img.naturalHeight}`)})}
function selectLine(i,scroll){activeLine=i;renderPage();if(scroll)$('text').querySelector(`[data-index="${i}"]`)?.scrollIntoView({block:'nearest'})}function go(i,line=-1){if(i<0||i>=pages.length)return;current=i;activeLine=line;renderPage()}$('open').addEventListener('click',()=>$('folder').click());$('folder').addEventListener('change',async e=>{clearUrls();pages=[];activeLine=-1;const files=Array.from(e.target.files||[]),xmlFiles=files.filter(f=>/\.xml$/i.test(f.name)&&/(^|\/)xml-alto\//i.test(f.webkitRelativePath||f.name)),images=files.filter(f=>/\.(jpe?g|png)$/i.test(f.name)&&/(^|\/)images\//i.test(f.webkitRelativePath||f.name));if(!xmlFiles.length){setStatus('Aucun fichier XML trouvé dans xml-alto/.');return}const allFiles=[...images];for(const f of xmlFiles){try{f._text=await f.text();const p=xmlPage(f,allFiles);if(p.imageFile){p.imageUrl=URL.createObjectURL(p.imageFile);objectUrls.push(p.imageUrl)}pages.push(p)}catch(err){console.warn(err)}}pages.sort((a,b)=>a.name.localeCompare(b.name,'fr',{numeric:true}));if(!pages.length){setStatus('Aucune page ALTO valide.');return}$('page').replaceChildren();pages.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.name;$('page').append(o)});['page','prev','next','zoom','query','search'].forEach(id=>$(id).disabled=false);setStatus(`${pages.length} page(s) chargée(s), ${images.length} image(s) trouvée(s).`);go(0);$('resultHead').textContent='';$('results').replaceChildren()});$('page').addEventListener('change',e=>go(Number(e.target.value)));$('prev').addEventListener('click',()=>go(current-1));$('next').addEventListener('click',()=>go(current+1));$('zoom').addEventListener('input',e=>{zoom=Number(e.target.value);renderPage()});
function wordsWithOffsets(s){const re=/[\p{L}\p{M}\p{N}_]+/gu;return Array.from(s.matchAll(re),m=>({word:m[0],start:m.index,end:m.index+m[0].length}))}function runSearch(){const q=$('query').value.trim();$('results').replaceChildren();if(!q){$('resultHead').textContent='Saisissez un mot à rechercher.';return}const hits=[],needle=fold(q);pages.forEach((p,pi)=>p.lines.forEach((l,li)=>{const ws=wordsWithOffsets(l.text);ws.forEach((w,wi)=>{if(fold(w.word)===needle)hits.push({pi,li,wi,ws})})}));$('resultHead').textContent=`${hits.length} occurrence(s) de « ${q} »`;hits.forEach(h=>{const b=document.createElement('button');b.className='hit';const left=h.ws.slice(Math.max(0,h.wi-5),h.wi).map(x=>x.word).join(' '),right=h.ws.slice(h.wi+1,h.wi+6).map(x=>x.word).join(' ');b.append(document.createTextNode((left?'…'+left+' ':'')));const m=document.createElement('mark');m.textContent=h.ws[h.wi].word;b.append(m);b.append(document.createTextNode(' '+right+(h.wi+6<h.ws.length?'…':'')+' — '+pages[h.pi].name));b.addEventListener('click',()=>{go(h.pi,h.li);$('text').querySelector(`[data-index="${h.li}"]`)?.scrollIntoView({block:'center',behavior:'smooth'})});$('results').append(b)})}$('search').addEventListener('click',runSearch);$('query').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch()});})();
</script></body></html>
